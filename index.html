<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clip — Built By Love</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1f232c;
  --border: #2a2f3a;
  --text: #e8eaed;
  --muted: #9aa3b2;
  --brand: #6c5ce7;
  --brand-2: #8b7bf0;
  --danger: #ff4757;
  --ok: #2ed573;
  --radius: 14px;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(1200px 800px at 70% -10%, #1b1f2a 0%, var(--bg) 55%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.brand .dot {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: grid; place-items: center;
  box-shadow: var(--shadow);
}
.brand .dot svg { width: 18px; height: 18px; }
.brand .dot.logo { background: transparent; box-shadow: none; width: 38px; height: 38px; }
.brand .dot.logo img { width: 38px; height: 38px; object-fit: contain; display: block; }

/* ---- Brand splash (same heart reveal as the Goals app) ---- */
.splash {
  position: fixed; inset: 0; z-index: 100;
  background: #FAF7F2;
  display: grid; place-items: center;
  transition: opacity .5s ease;
}
.splash.hide { opacity: 0; pointer-events: none; }
.splash.gone { display: none; }
.splash-logo { width: 200px; height: 200px; object-fit: contain; }
@media (prefers-color-scheme: dark) { /* keep cream — matches Goals brand splash */ }

/* ---- Live mic level / EQ meter ---- */
.micmeter {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--border);
  background: var(--panel-2); border-radius: 10px;
}
.micmeter.hidden { display: none; }
.micmeter-ico { color: var(--muted); display: inline-flex; transition: color .15s; }
.micmeter-ico svg { width: 18px; height: 18px; }
.micmeter.live .micmeter-ico { color: var(--ok); }
.micmeter canvas { flex: 1; height: 26px; width: 100%; display: block; }

/* ---- 3·2·1 countdown overlay ---- */
.countdown {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,.45); backdrop-filter: blur(2px); z-index: 5;
}
.countdown.on { display: flex; }
.countdown span {
  font-size: 128px; font-weight: 800; color: #fff; line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 8px 40px rgba(0,0,0,.5);
  animation: countpop .9s ease-out;
}
@keyframes countpop {
  0% { transform: scale(.4); opacity: 0; }
  30% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(.9); opacity: .15; }
}
.row.toggles { flex-wrap: wrap; gap: 10px 20px; }
.brand h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: .2px; }
.brand .by { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.preview {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
  display: grid;
  place-items: center;
}
.preview canvas { width: 100%; height: 100%; object-fit: contain; display: none; }
.preview .placeholder {
  text-align: center; color: var(--muted); padding: 24px;
}
.preview .placeholder svg { width: 46px; height: 46px; opacity: .5; margin-bottom: 10px; }

.rec-badge {
  position: absolute; top: 14px; left: 14px;
  display: none; align-items: center; gap: 8px;
  background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 999px;
  font-size: 13px; font-variant-numeric: tabular-nums; backdrop-filter: blur(6px);
}
.rec-badge.on { display: flex; }
.rec-badge .blink {
  width: 10px; height: 10px; border-radius: 50%; background: var(--danger);
  animation: blink 1s steps(2, start) infinite;
}
@keyframes blink { to { opacity: 0; } }

.controls { padding: 18px; display: flex; flex-direction: column; gap: 16px; }

.sources { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.src {
  border: 1px solid var(--border); background: var(--panel-2);
  border-radius: 10px; padding: 12px 10px; cursor: pointer; text-align: center;
  transition: .15s; user-select: none;
}
.src:hover { border-color: #3a4150; }
.src.active { border-color: var(--brand); background: #23213a; }
.src svg { width: 22px; height: 22px; margin-bottom: 6px; }
.src .t { font-size: 13px; font-weight: 550; }
.src .s { font-size: 11px; color: var(--muted); margin-top: 2px; }

.devices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dev { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
.dev span { padding-left: 2px; }
.dev select {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 10px; border-radius: 9px; font-size: 13px; cursor: pointer;
  max-width: 100%; text-overflow: ellipsis;
}
.dev select:hover { border-color: #3a4150; }
.dev.hidden { display: none; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: .15s; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: #3a4150; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); border: none; }
.btn.danger { background: var(--danger); border: none; }
.btn.ghost { background: transparent; }
.btn.block { flex: 1; justify-content: center; }

.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--brand); width: 16px; height: 16px; }

.status { font-size: 13px; color: var(--muted); min-height: 18px; }
.status.err { color: var(--danger); }
.status.ok { color: var(--ok); }

.result {
  display: none; margin-top: 16px; padding: 16px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--panel-2);
}
.result.show { display: block; }
.result h3 { margin: 0 0 10px; font-size: 15px; }
.result video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 12px; }
.linkbox { display: flex; gap: 8px; }
.linkbox input {
  flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 8px; font-size: 13px;
}

.config-warn {
  margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px;
  background: #2a2410; border: 1px solid #5a4a16; color: #f1d98a; display: none;
}
.config-warn.show { display: block; }
.config-warn code { background: rgba(0,0,0,.3); padding: 1px 6px; border-radius: 4px; }

.hint { font-size: 12px; color: var(--muted); }
a { color: var(--brand-2); }

/* ---- Desktop source picker ---- */
.picker {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50;
}
.picker.show { display: flex; }
.picker-card {
  width: min(820px, 100%); max-height: 86vh; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); overflow: hidden;
}
.picker-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
.picker-head h3 { margin: 0; font-size: 17px; }
.picker-tabs { display: flex; gap: 8px; padding: 0 20px 14px; border-bottom: 1px solid var(--border); }
.ptab {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
}
.ptab.active { color: var(--text); border-color: var(--brand); background: #23213a; }
.picker-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;
  padding: 18px 20px; overflow-y: auto;
}
.psrc {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 10px;
  overflow: hidden; cursor: pointer; transition: .15s; text-align: left;
}
.psrc:hover { border-color: var(--brand); transform: translateY(-2px); }
.psrc img { width: 100%; height: 120px; object-fit: cover; background: #000; display: block; }
.psrc .cap { padding: 8px 10px; font-size: 12px; display: flex; align-items: center; gap: 7px; }
.psrc .cap img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
.psrc .cap span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.player { max-width: 960px; }
.player video { width: 100%; background:#000; border-radius: 12px; box-shadow: var(--shadow); display:block; }
.meta { display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:12px; flex-wrap:wrap; }
.meta .title { font-size:16px; font-weight:600; }
.empty { text-align:center; color:var(--muted); padding:60px 20px; }
</style>
</head>
